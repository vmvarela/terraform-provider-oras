name: Feature request
description: Suggest an improvement to the provider
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        The provider is experimental and pre-1.0 — breaking changes to the state storage
        format or tag scheme are still possible. Ideas that change those need discussion first.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what is missing or painful?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like the provider to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you've tried, or other backends/providers that solve it.
    validations:
      required: false
