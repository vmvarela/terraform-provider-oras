name: Release Drafter

on:
  push:
    branches:
      - master
    paths-ignore:
      - VERSION
  # pull_request_target runs with the base-branch GITHUB_TOKEN, so the
  # autolabeler can label fork PRs. The action works metadata-only via the API:
  # no checkout, no PR code execution.
  pull_request_target:
    types: [opened, reopened, synchronize, edited]

permissions: {}

jobs:
  # Drafts the next release from merged PRs. Only needs write access to releases.
  update-release-draft:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7

  # Labels PRs from their title so the drafter can categorise them.
  autolabel:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: release-drafter/release-drafter/autolabeler@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7
