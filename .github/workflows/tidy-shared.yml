name: Tidy shared ORAS dependency

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/use-oras-state
    paths:
      - go.mod
      - internal/provider/**
      - internal/statestore/**
      - .github/workflows/tidy-shared.yml

permissions:
  contents: read

jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go mod tidy
      - uses: actions/upload-artifact@v6
        with:
          name: provider-tidied-modules
          path: |
            go.mod
            go.sum
