name: Tidy oras-state bump

on:
  push:
    branches: [build/bump-oras-state]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tidy-oras-state-bump
  cancel-in-progress: true

jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go mod tidy
      - uses: actions/upload-artifact@v7
        with:
          name: tidied-modules
          path: |
            go.mod
            go.sum
