name: Tidy credential resolver

on:
  push:
    branches:
      - refactor/credential-resolver
    paths:
      - go.mod
      - go.sum
      - internal/credentials/**
      - internal/statestore/oci.go
      - .github/workflows/tidy-credentials.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go mod tidy
      - uses: actions/upload-artifact@v6
        with:
          name: provider-tidied-modules
          path: |
            go.mod
            go.sum
