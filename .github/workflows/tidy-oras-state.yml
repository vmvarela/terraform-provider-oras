name: Tidy oras-state migration

on:
  push:
    branches: [refactor/use-oras-state-repo]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go mod tidy
      - uses: actions/upload-artifact@v7
        with:
          name: tidied-modules
          path: |
            go.mod
            go.sum
