name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
categories:
  - title: '💥 Breaking Changes'
    semver-increment: 'major'
    exclusive: true
    when:
      conventional:
        breaking: true
  - title: '🚀 Features'
    semver-increment: 'minor'
    when:
      conventional:
        type: 'feat'
  - title: '🐛 Bug Fixes'
    semver-increment: 'patch'
    when:
      conventional:
        type: 'fix'
  - title: '📖 Documentation'
    semver-increment: 'patch'
    when:
      conventional:
        type: 'docs'
  - title: '🧰 Maintenance'
    semver-increment: 'patch'
change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: '\<*_&'
# Keep historical prereleases in version resolution while stable releases
# remain the normal publication path.
include-pre-releases: true
sync-labels: true
autolabeler:
  - labels:
      - 'enhancement'
    title:
      - '/^feat(\(.+\))?!?:/i'
  - labels:
      - 'bug'
    title:
      - '/^fix(\(.+\))?!?:/i'
  - labels:
      - 'documentation'
    title:
      - '/^docs(\(.+\))?!?:/i'
template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
