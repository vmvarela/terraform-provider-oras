name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
categories:
  - title: '🚀 Features'
    labels:
      - 'type:feature'
  - title: '🐛 Bug Fixes'
    labels:
      - 'type:bug'
  - title: '🧰 Maintenance'
    labels:
      - 'type:chore'
      - 'dependencies'
  - title: '📖 Documentation'
    labels:
      - 'type:docs'
change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: '\<*_&'
version-resolver:
  major:
    labels:
      - 'breaking'
  minor:
    labels:
      - 'type:feature'
  patch:
    labels:
      - 'type:bug'
      - 'type:chore'
      - 'type:docs'
      - 'dependencies'
  default: patch
# Releases are prerelease-only (-alpha suffixes); without this, the resolver
# ignores prereleases as "latest" and falls back to v0.0.1.
include-pre-releases: true
autolabeler:
  - label: 'type:feature'
    title:
      - '/^feat(\(.+\))?!?:/'
    branch:
      - '/^feature\//'
      - '/^feat\//'
  - label: 'type:bug'
    title:
      - '/^fix(\(.+\))?!?:/'
    branch:
      - '/^fix\//'
      - '/^bugfix\//'
  - label: 'type:chore'
    title:
      - '/^chore(\(.+\))?!?:/'
      - '/^ci(\(.+\))?!?:/'
      - '/^build(\(.+\))?!?:/'
    branch:
      - '/^chore\//'
  - label: 'type:docs'
    title:
      - '/^docs(\(.+\))?!?:/'
    branch:
      - '/^docs\//'
  - label: 'breaking'
    title:
      - '/^[a-z]+(\(.+\))?!:/'
template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
